name: docdrift
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  docdrift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Ashutosh-Kumar03/docdrift@main
        with:
          api-key: ${{ secrets.DOCDRIFT_API_KEY }}
